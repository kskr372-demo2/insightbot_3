name: InsightBot CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

# Required for GitHub OIDC authentication with Google Cloud
permissions:
  contents: read
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Run tests
      # --------------------------------------------------
      - name: Run tests
        working-directory: backend
        run: |
          pytest

      # --------------------------------------------------
      # 5. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t insightbot-backend:ci \
            ./backend

      # --------------------------------------------------
      # 6. Authenticate to Google Cloud
      # --------------------------------------------------
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/971186642530/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: insightbot-github@insightbot-505009.iam.gserviceaccount.com

      # --------------------------------------------------
      # 7. Set up Google Cloud SDK
      # --------------------------------------------------
      - name: Set up Google Cloud SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: google-github-actions/setup-gcloud@v2

      # --------------------------------------------------
      # 8. Configure Docker for Artifact Registry
      # --------------------------------------------------
      - name: Configure Docker authentication
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # --------------------------------------------------
      # 9. Tag Docker image
      # --------------------------------------------------
      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag insightbot-backend:ci \
            asia-south1-docker.pkg.dev/insightbot-505009/insightbot/insightbot-backend:${{ github.sha }}

      # --------------------------------------------------
      # 10. Push Docker image
      # --------------------------------------------------
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push \
            asia-south1-docker.pkg.dev/insightbot-505009/insightbot/insightbot-backend:${{ github.sha }}
            # --------------------------------------------------
      # 11. Deploy to Cloud Run
      # --------------------------------------------------
      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: insightbot-backend
          region: asia-south1
          image: asia-south1-docker.pkg.dev/insightbot-505009/insightbot/insightbot-backend:${{ github.sha }}